name: build-android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  export-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Godot and Android
        run: |
          mkdir -p $HOME/.config/godot $HOME/.local/share/godot/export_templates build
          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then
            cp -r /root/.local/share/godot/export_templates/4.3.stable $HOME/.local/share/godot/export_templates/ || true
          fi
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore $HOME/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          cat > $HOME/.config/godot/editor_settings-4.3.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/shutdown_adb_on_exit = true
          EOT

      - name: Import project
        run: godot --headless --verbose --import || true

      - name: Export APK
        run: godot --headless --verbose --export-debug "Android" build/darb-alrafidain.apk

      - uses: actions/upload-artifact@v4
        with:
          name: darb-alrafidain-apk
          path: build/darb-alrafidain.apk
